<style>

body{
    margin:0;
    padding:0;
    background:#f5f6fa;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    display:flex;
    min-height:100vh;
}

#sidebar{
    width:260px;
    background:#1f2937;
    color:#fff;
}

#main{
    flex:1;
    display:flex;
    flex-direction:column;
}

#topbar{
    height:65px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
}

#app-content{
    flex:1;
    padding:25px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.kpi-card{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    display:flex;
    align-items:center;
    gap:16px;
    transition:transform .15s ease, box-shadow .15s ease;
}

.kpi-card:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

.kpi-icon-circle{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.kpi-icon-blue{ background:#e7efff; color:#4361ee; }
.kpi-icon-green{ background:#e3f7ef; color:#2a9d8f; }
.kpi-icon-orange{ background:#fff2e2; color:#f77f00; }
.kpi-icon-red{ background:#fde8e8; color:#e63946; }

.kpi-title{
    color:#777;
    font-size:14px;
}

.kpi-value{
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
}

.panel{
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.panel-title{
    font-size:20px;
    margin-bottom:20px;
}

.loader-overlay{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.6);
    display:flex;
    align-items:center;
    justify-content:center;
}

</style>
