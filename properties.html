<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1"><i class="bi bi-building me-2"></i>Management Proprietăți</h2>
            <p class="text-muted small mb-0">Vizualizează, adaugă și editează proprietățile imobiliare din portofoliu.</p>
        </div>
        <div>
            <button class="btn btn-outline-primary me-2" onclick="loadProperties()">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizare
            </button>
            <button class="btn btn-success" onclick="openAddModal()">
                <i class="bi bi-plus-lg me-1"></i> Adaugă Proprietate
            </button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Denumire</th>
                            <th>Tip</th>
                            <th>Adresă completă</th>
                            <th>Oraș</th>
                            <th>Proprietar</th>
                            <th>Status</th>
                            <th>Observații</th>
                            <th class="pe-4 text-end">Acțiuni</th>
                        </tr>
                    </thead>
                    <tbody id="properties-table-body">
                        <tr>
                            <td colspan="8" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <div class="text-muted small mt-2">Se încarcă proprietățile...</div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAddProperty" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalPropertyTitle"><i class="bi bi-plus-circle me-2 text-success"></i>Proprietate Nouă</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="form-add-property" onsubmit="handleFormSubmit(event)">
                <div class="modal-body">
                    <input type="hidden" name="id" id="field-id" value="">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Denumire Proprietate *</label>
                        <input type="text" class="form-control" name="denumire" required placeholder="Ex: Apartament 3 camere">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Tip Proprietate *</label>
                        <select class="form-select" name="tip" required>
                            <option value="Apartament">Apartament</option>
                            <option value="Garsoniera">Garsonieră</option>
                            <option value="Casa">Casă</option>
                            <option value="Birou / Comercial">Birou / Comercial</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Adresă completă *</label>
                        <input type="text" class="form-control" name="adresa" required placeholder="Strada, Numar, Bloc...">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Oraș *</label>
                            <input type="text" class="form-control" name="oras" required placeholder="Ex: București">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label small fw-bold">Proprietar / Manager *</label>
                            <input type="text" class="form-control" name="proprietar" required placeholder="Nume">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Status *</label>
                        <select class="form-select" name="status">
                            <option value="Activ">Activ (Disponibil)</option>
                            <option value="Inactiv">Inactiv</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Observații</label>
                        <textarea class="form-control" name="observatii" rows="2" placeholder="Opțional..."></textarea>
                    </div>
                </div>
                <div class="modal-footer table-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anulează</button>
                    <button type="submit" class="btn btn-success" id="btn-save-property">Salvează Proprietatea</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Punct de pornire automat la injectarea ferestrei
let propertiesCache = [];

(function() {
    loadProperties();
})();

function loadProperties() {
    const tbody = document.getElementById("properties-table-body");
    if (!tbody) return;

    tbody.innerHTML = `
        <tr>
            <td colspan="8" class="text-center py-5">
                <div class="spinner-border text-primary" role="status"></div>
                <div class="text-muted small mt-2">Se încarcă proprietățile...</div>
            </td>
        </tr>
    `;

    google.script.run
        .withSuccessHandler(function(properties) {
            propertiesCache = properties || [];

            if (propertiesCache.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center py-4 text-muted">
                            <i class="bi bi-info-circle me-1"></i> Nu există proprietăți înregistrate.
                        </td>
                    </tr>
                `;
                return;
            }

            let html = "";
            propertiesCache.forEach(prop => {
                const badgeClass = prop.status === "Activ" ? "bg-success text-white" : "bg-secondary text-white";
                html += `
                    <tr>
                        <td class="ps-4 fw-bold">${prop.denumire}</td>
                        <td><span class="badge bg-light text-dark border">${prop.tip}</span></td>
                        <td>${prop.adresa}</td>
                        <td>${prop.oras}</td>
                        <td>${prop.proprietar}</td>
                        <td><span class="badge ${badgeClass}">${prop.status}</span></td>
                        <td class="text-muted small">${prop.observatii || "-"}</td>
                        <td class="pe-4 text-end">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${prop.id}')" title="Editează">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="handleDeleteProperty('${prop.id}', '${String(prop.denumire || '').replace(/'/g, "\\'")}')" title="Șterge">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        })
        .withFailureHandler(function(err) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center py-4 text-danger">
                        <i class="bi bi-exclamation-triangle-fill me-1"></i> Eroare încărcare server: ${err.message}
                    </td>
                </tr>
            `;
        })
        .apiGetProperties();
}

function openAddModal() {
    const form = document.getElementById("form-add-property");
    form.reset();
    document.getElementById("field-id").value = "";
    document.getElementById("modalPropertyTitle").innerHTML = '<i class="bi bi-plus-circle me-2 text-success"></i>Proprietate Nouă';
    document.getElementById("btn-save-property").textContent = "Salvează Proprietatea";

    const modalEl = document.getElementById('modalAddProperty');
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
}

function openEditModal(id) {
    const prop = propertiesCache.find(p => p.id === id);
    if (!prop) { alert("Proprietatea nu a fost găsită în listă. Actualizează pagina și încearcă din nou."); return; }

    const form = document.getElementById("form-add-property");
    form.reset();
    document.getElementById("field-id").value = prop.id;
    form.querySelector('[name="denumire"]').value = prop.denumire || "";
    form.querySelector('[name="tip"]').value = prop.tip || "Apartament";
    form.querySelector('[name="adresa"]').value = prop.adresa || "";
    form.querySelector('[name="oras"]').value = prop.oras || "";
    form.querySelector('[name="proprietar"]').value = prop.proprietar || "";
    form.querySelector('[name="status"]').value = prop.status || "Activ";
    form.querySelector('[name="observatii"]').value = prop.observatii || "";

    document.getElementById("modalPropertyTitle").innerHTML = '<i class="bi bi-pencil-square me-2 text-primary"></i>Editează Proprietate';
    document.getElementById("btn-save-property").textContent = "Salvează Modificările";

    const modalEl = document.getElementById('modalAddProperty');
    bootstrap.Modal.getOrCreateInstance(modalEl).show();
}

function handleFormSubmit(event) {
    event.preventDefault();
    
    const form = event.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const originalBtnText = submitBtn.innerHTML;
    
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Se salvează...`;

    const formData = new FormData(form);
    const id = formData.get("id");
    const propertyObject = {
        denumire: formData.get("denumire"),
        tip: formData.get("tip"),
        adresa: formData.get("adresa"),
        oras: formData.get("oras"),
        proprietar: formData.get("proprietar"),
        status: formData.get("status"),
        observatii: formData.get("observatii")
    };

    function onSuccess(response) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;

        if (response && response.success) {
            const modalEl = document.getElementById('modalAddProperty');
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            form.reset();
            loadProperties();
        } else {
            alert("Eroare la salvare.");
        }
    }

    function onFailure(err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
        alert("Eroare de comunicare cu serverul: " + err.message);
    }

    if (id) {
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).apiUpdateProperty(id, propertyObject);
    } else {
        google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).apiSaveProperty(propertyObject);
    }
}

function handleDeleteProperty(id, denumire) {
    if (!confirm('Sigur ștergi proprietatea "' + denumire + '"? Acțiunea nu poate fi anulată.')) return;

    google.script.run
        .withSuccessHandler(function(response) {
            if (response && response.success) {
                loadProperties();
            } else {
                alert("Eroare la ștergere.");
            }
        })
        .withFailureHandler(function(err) {
            alert("Eroare de comunicare cu serverul: " + err.message);
        })
        .apiDeleteProperty(id);
}
</script>
